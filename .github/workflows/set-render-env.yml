name: Set one Render env var

# Sets (or updates) a SINGLE environment variable on a Render service, then
# deploys it. The value never appears in the workflow inputs or the logs — it is
# read from a repository secret, so nothing sensitive is typed into the UI.
#
# Deliberately uses PUT /env-vars/{key}, which touches one key. The bare
# PUT /env-vars endpoint REPLACES the whole environment and would wipe the
# database URL of whatever service it was pointed at.

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: Render service ID (srv-...) or service name
        required: true
        default: srv-d79f71p4tr6s73csprgg
      env_key:
        description: Name of the environment variable to set
        required: true
        default: OPENAI_API_KEY
      secret_name:
        description: Which repository secret holds the value
        required: true
        default: INTERNAL_SERVICE_KEY
        type: choice
        options:
          - INTERNAL_SERVICE_KEY
          - DASH_PORTAL_KEY
          - STRIPE_RESTRICTED_KEY
          - OPENAI_API_KEY
          - BREVO_API_KEY
          - WHATSAPP_TOKEN
          - WHATSAPP_PHONE_ID
          # For values that are NOT credentials - a sender address, a template
          # name. Those go in plain_value below and may safely appear in the
          # public log. Nothing that is a secret is allowed through this door;
          # the allow-list in the Guard step enforces it.
          - PLAIN
      plain_value:
        description: The value, ONLY when secret_name is PLAIN (never a credential)
        required: false
        default: ''

concurrency:
  group: render-env
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      # Chosen by name, never typed in. Workflow INPUTS are written to a public
      # log on a public repository; repository SECRETS are masked. A shared key
      # pasted into the UI would be published the moment the job ran.
      SECRET_VALUE: ${{ github.event.inputs.secret_name == 'INTERNAL_SERVICE_KEY' && secrets.INTERNAL_SERVICE_KEY || github.event.inputs.secret_name == 'DASH_PORTAL_KEY' && secrets.DASH_PORTAL_KEY || github.event.inputs.secret_name == 'STRIPE_RESTRICTED_KEY' && secrets.STRIPE_RESTRICTED_KEY || github.event.inputs.secret_name == 'BREVO_API_KEY' && secrets.BREVO_API_KEY || github.event.inputs.secret_name == 'WHATSAPP_TOKEN' && secrets.WHATSAPP_TOKEN || github.event.inputs.secret_name == 'WHATSAPP_PHONE_ID' && secrets.WHATSAPP_PHONE_ID || github.event.inputs.secret_name == 'PLAIN' && github.event.inputs.plain_value || secrets.OPENAI_API_KEY }}
      SERVICE_NAME: ${{ github.event.inputs.service_name }}
      ENV_KEY: ${{ github.event.inputs.env_key }}
    steps:
      - name: Guard
        run: |
          [ -n "$RENDER_API_KEY" ] || { echo "RENDER_API_KEY secret is not set"; exit 1; }
          [ -n "$SECRET_VALUE" ] || { echo "the value secret is empty"; exit 1; }
          case "${{ github.event.inputs.secret_name }}" in
            OPENAI_API_KEY|INTERNAL_SERVICE_KEY|DASH_PORTAL_KEY|STRIPE_RESTRICTED_KEY) ;;
            BREVO_API_KEY|WHATSAPP_TOKEN|WHATSAPP_PHONE_ID) ;;
            PLAIN)
              # ⛔ A plain value is written to a PUBLIC log. Only env keys that
              # are genuinely not credentials may come through here - a sender
              # address, a template name, an API version. Anything else must
              # be a repository secret.
              case "$ENV_KEY" in
                MAIL_FROM|MAIL_FROM_NAME|WHATSAPP_TEMPLATE_TICKET|WHATSAPP_TEMPLATE_COURSE|WHATSAPP_API_VERSION) ;;
                *) echo "$ENV_KEY may not be set as a plain value - use a repository secret"; exit 1 ;;
              esac ;;
            *) echo "that secret is not wired up"; exit 1 ;;
          esac

      - name: Resolve service id by name
        id: resolve
        run: |
          set -euo pipefail
          # A service ID never changes and nobody can rename it. haitibiznis-api
          # is called "e.HaitiBiznis.com" in the dashboard, so a name lookup
          # finds nothing - see the note in deploy-other-service.yml.
          case "$SERVICE_NAME" in
            srv-*) sid="$SERVICE_NAME" ;;
            *) sid="$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services?name=$SERVICE_NAME&limit=1" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d[0].get("service",d[0]))["id"] if d else "")')" ;;
          esac
          [ -n "$sid" ] || { echo "no service named $SERVICE_NAME"; exit 1; }
          echo "Resolved $SERVICE_NAME -> $sid"
          echo "sid=$sid" >> "$GITHUB_OUTPUT"

      - name: Set the variable
        run: |
          set -euo pipefail
          # Built with json.dumps and written to a file, so the value is neither
          # shell-quoted by hand nor visible in the process list.
          python3 -c 'import json,os;open("/tmp/env.json","w").write(json.dumps({"value":os.environ["SECRET_VALUE"]}))'
          code="$(curl -sS -o /tmp/env.out -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$SID/env-vars/$ENV_KEY" -d @/tmp/env.json)"
          rm -f /tmp/env.json
          echo "Render replied $code"
          [ "$code" = "200" ] || [ "$code" = "201" ] || { echo "failed to set $ENV_KEY"; exit 1; }
        env:
          SID: ${{ steps.resolve.outputs.sid }}

      - name: Deploy so the new value is picked up
        run: |
          set -euo pipefail
          id="$(curl -sS -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" "https://api.render.com/v1/services/${{ steps.resolve.outputs.sid }}/deploys" -d '{"clearCache":"do_not_clear"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "Triggered deploy $id"
          for i in $(seq 1 80); do
            st="$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/${{ steps.resolve.outputs.sid }}/deploys/$id" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
            echo "  $i: $st"
            case "$st" in
              live) echo "deploy live"; exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed) echo "deploy $st"; exit 1 ;;
            esac
            sleep 15
          done
          echo "timed out waiting for the deploy"; exit 1
