name: Admin access log review (encrypted)

# 16 Oct 2026 - Jeffery: "Review administrator access logs for suspicious
# activity." This repository is PUBLIC, so nothing sensitive may be printed:
# the job prints only totals, and the matching log lines are encrypted with a
# public key whose private half only the developer holds, then uploaded as an
# artifact (readable by nobody else).
on:
  workflow_dispatch:
    inputs:
      service_id:
        description: Render service id
        required: true
        default: srv-d7an362dbo4c73a5njt0
      days:
        description: How many days back (Render keeps a limited window)
        required: true
        default: '30'

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SID: ${{ github.event.inputs.service_id }}
      DAYS: ${{ github.event.inputs.days }}
    steps:
      - name: Fetch and filter the logs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, time, urllib.request, urllib.parse, urllib.error, datetime
          K = os.environ['RENDER_API_KEY']; SID = os.environ['SID']; DAYS = int(os.environ['DAYS'])
          def get(path):
              q = urllib.request.Request('https://api.render.com/v1' + path, headers={'Authorization': 'Bearer ' + K, 'Accept': 'application/json'})
              return json.loads(urllib.request.urlopen(q, timeout=60).read())
          svc = get('/services/' + SID)
          owner = svc.get('ownerId') or svc.get('service', {}).get('ownerId')
          REQ = re.compile(r'"([A-Z]+) (\S+) HTTP/[0-9.]+" ([0-9]{3})')
          PAT = [r'^/api/payouts', r'^/api/drivers/admin', r'^/api/drivers/stats', r'^/api/drivers/?$', r'^/api/drivers/[^/]+/(approve|reject|suspend|pin)',
                 r'^/api/rides/reports', r'^/api/rides/earnings', r'^/api/rides/?$', r'^/api/rides/[^/]+/refund', r'^/api/payments/admin', r'^/api/medical/(dashboard|export|claims|settlement)',
                 r'^/api/pricing', r'^/api/businesses/?($|stats|[^/]+/(approve|reject))', r'^/api/trips/[^/]+/(approve|reject)', r'^/api/logistics/.*verify', r'^/api/diag', r'^/api/admin-account', r'^/api/dash']
          def is_admin(msg):
              m = REQ.search(msg)
              if not m: return False
              path = m.group(2).split('?')[0].lower().rstrip('/') or '/'
              return any(re.search(x, path) for x in PAT)
          class _A:
              search = staticmethod(is_admin)
          ADMIN = _A()
          def fmt(t): return t.strftime('%Y-%m-%dT%H:%M:%SZ')
          end = datetime.datetime.utcnow()
          lines = []; total = 0; first = None; used_days = None
          for days in [d for d in (min(DAYS, 29), 14, 7, 3, 1)]:
              start = end - datetime.timedelta(days=days); cursor = fmt(start); pages = 0; failed = False
              lines = []; total = 0; first = None
              while pages < 600:
                  qs = urllib.parse.urlencode({'ownerId': owner, 'resource': SID, 'startTime': cursor, 'endTime': fmt(end), 'limit': 100, 'direction': 'forward'})
                  try:
                      d = get('/logs?' + qs)
                  except urllib.error.HTTPError as e:
                      print('logs API error for a %d-day window: %s %s' % (days, e.code, e.read()[:300].decode('utf8', 'replace'))); failed = True; break
                  logs = d.get('logs', []); pages += 1
                  for l in logs:
                      total += 1; msg = l.get('message', ''); ts = l.get('timestamp', '')
                      first = first or ts
                      if ADMIN.search(msg): lines.append(ts + ' ' + msg)
                  if not d.get('hasMore'): break
                  cursor = d.get('nextStartTime') or (logs[-1]['timestamp'] if logs else None)
                  if not cursor: break
              if not failed:
                  used_days = days; break
          print('window used (days):', used_days)
          open('/tmp/admin_lines.txt', 'w').write('\n'.join(lines))
          ok = [x for x in lines if re.search(r'" (2[0-9]{2}) ', x)]
          print('log lines scanned:', total, '| earliest log line available:', first)
          print('admin-route requests:', len(lines), '| answered 2xx:', len(ok))
          PY
      - name: Encrypt the matching lines
        run: |
          set -euo pipefail
          cat > /tmp/pub.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA5N2fPaHb0jDm/6ZIJut2
          Vm2iyeQt3v207mKDwW0lATbFzEep13RfB+vZ9dJyLRF/qlRD4nujdVFYJJ3MxZLw
          20BiOE0SxTtTWobXJYHzPiiTNp+++4yy6875ujtMeFeTRQM5F9bahVpztVunkZxJ
          ynirCZyIQAZAAK03SdfuOrSL7DkIAUlT8ksQH4BP/538sIG8U2R1rXrCEOrP0e1O
          RVttvBrIoX5j/nOLfKhFNtwsdYryMPhGrKFRgPyUKbpc7dWU0EGIIXa2xTwkLe1w
          SIAnOWcx0aEzliJB2ZhU99aLUkGDTSkS040mFm7lMusc0Sjr7zAf/ZgL3QjggBJL
          cf2IjCouVfcNyV5aqFGuDCP3pgRba91P+0WOMzjONIC6d9lUhA1ohF1Mb7F0ljK+
          dol0/+yduzdUgKnFa4WkP0zF/vjTBwHB7c48Teb2FTE+z/NOy70VzoXbPUfWu3ix
          R5KZdDWE823AqZzi8kNPAzD8SCUe8iXXzpNbPfT87CcxAgMBAAE=
          -----END PUBLIC KEY-----
          KEY
          sed -i 's/^ *//' /tmp/pub.pem
          openssl rand -hex 32 > /tmp/k
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/admin_lines.txt -out /tmp/admin_lines.enc -pass file:/tmp/k
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in /tmp/k -out /tmp/k.enc
          shred -u /tmp/k /tmp/admin_lines.txt
          mkdir -p out && mv /tmp/admin_lines.enc /tmp/k.enc out/
      - uses: actions/upload-artifact@v4
        with:
          name: admin-log-review
          path: out/
          retention-days: 3
